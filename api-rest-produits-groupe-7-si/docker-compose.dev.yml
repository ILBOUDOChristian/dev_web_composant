services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    attach: false
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_HOST_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    attach: false
    ports:
      - "${FRONTEND_HOST_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
      wso2:
        condition: service_started

  wso2:
    build:
      context: ./wso2
      dockerfile: Dockerfile
      args:
        WSO2_KEYSTORE_PASSWORD: ${WSO2_KEYSTORE_PASSWORD}
    image: api-rest-produits-groupe-7-si-wso2:1.0.0
    restart: unless-stopped
    attach: false
    environment:
      WSO2_DB_HOST: ${WSO2_DB_HOST}
      WSO2_DB_PORT: ${WSO2_DB_PORT}
      WSO2_DB_NAME: ${WSO2_DB_NAME}
      WSO2_DB_USER: ${WSO2_DB_USER}
      WSO2_DB_PASSWORD: ${WSO2_DB_PASSWORD}
      WSO2_KEYSTORE_PASSWORD: ${WSO2_KEYSTORE_PASSWORD}
    ports:
      - "${WSO2_HTTP_HOST_PORT}:8290"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Mode serveur activé pour Docker
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

  urls:
    image: alpine:3.20
    restart: "no"
    attach: true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      PORT_DB:       ${POSTGRES_HOST_PORT:-5434}
      PORT_PGADMIN:  ${PGADMIN_HOST_PORT:-5050}
      PORT_BACKEND:  ${BACKEND_HOST_PORT:-8001}
      PORT_FRONTEND: ${FRONTEND_HOST_PORT:-3001}
    command: >
      sh -c "
        echo '' &&
        echo \"  db           -> localhost:\$${PORT_DB}  (PostgreSQL)\" &&
        echo \"  db UI        -> http://localhost:\$${PORT_PGADMIN}  (pgAdmin)\" &&
        echo \"  backend      -> http://localhost:\$${PORT_BACKEND}/health\" &&
        echo \"  api produit  -> http://localhost:\$${PORT_FRONTEND}\" &&
        echo ''
      "
